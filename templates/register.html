{% extends 'base.html' %}
{% block title %}Register — Dental AI{% endblock %}
{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="card">
      <div class="card-header">
        <i class="bi bi-person-plus-fill me-2"></i>Create Account
      </div>
      <div class="card-body p-4">
        <form method="POST">
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" name="username" class="form-control" required placeholder="Choose a username">
          </div>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" required placeholder="your@email.com">
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required placeholder="Min 6 characters">
          </div>
          <div class="mb-4">
            <label class="form-label">Confirm Password</label>
            <input type="password" name="confirm_password" class="form-control" required placeholder="Repeat password">
          </div>
          <button type="submit" class="btn btn-primary w-100">
            <i class="bi bi-person-check me-2"></i>Register
          </button>
        </form>
        <hr>
        <p class="text-center mb-0">Already have an account?
          <a href="{{ url_for('login') }}">Log in</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
